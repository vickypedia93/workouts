/* v1.52 – jämn mobil layout */
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0}
button,input,select,textarea{font:inherit;max-width:100%}
button{min-height:44px}
main,.container,.app,.content{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.card{width:100%;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:0 0 auto}
.exercisePick{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;width:100%}
.sets{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;width:100%}
.sets input{width:100%;min-width:0}
.head{min-width:0}
.calDay{min-width:0;width:100%;overflow:hidden}
.calEmoji{min-height:18px}
.pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{max-width:100vw}
#sheet>div{max-width:calc(100vw - 24px);width:100%}
input,select{width:100%;min-height:44px}
label input[type="checkbox"],label input[type="radio"]{width:auto;min-height:auto}
table{width:100%;table-layout:fixed}
td,th{word-break:break-word}
.version-badge{white-space:nowrap}

@media (max-width:600px){
  body{font-size:15px}
  main,.container,.app,.content{padding-left:12px;padding-right:12px}
  .card{padding:14px;margin-bottom:10px;border-radius:14px}
  h1{font-size:24px}
  h2{font-size:20px}
  h3{font-size:17px}
  .row{align-items:flex-start}
  .row>button{width:auto}
  .actions{width:100%}
  .actions button{flex:1 1 140px;width:auto}
  .exercisePick{align-items:flex-start}
  .exercisePick>span{flex:1 1 100%;min-width:0}
  .exercisePick .actions{width:auto;flex:0 0 auto}
  .exercisePick .actions button{flex:0 0 auto;min-width:44px}
  .sets{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 42px;gap:6px}
  .sets input{padding:9px 7px}
  .check{width:42px;min-width:42px;padding:0}
  .calDay{padding:7px 3px;font-size:12px}
  .calNum{font-size:14px}
  .calEmoji{font-size:16px}
  header{gap:8px}
  header .actions{width:auto}
  header .actions button{flex:0 0 auto}
  nav{overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{white-space:nowrap;flex:0 0 auto}
  #sheet{padding:0 12px}
  #sheet>div{max-height:90vh;overflow-y:auto}
}

    <div><h1>Workouts</h1><div class="sub">Din träning, sparad på telefonen. · v1.52</div></div>
    <div class="actions" style="margin:0"><button class="secondary profile-chip" onclick="showProfiles()"><span>👤 <span id="activeProfileName"></span>⌄</span><small>Byt profil</small></button></div>
  </div>

<script>

const EXERCISE_TARGETS = {
  "Dead Bug":"3 × 8–10 / sida",
  "Cable Crunch":"3 × 10–15",
  "RKC Plank":"3 × 15–30 sek",
  "Pallof Press":"3 × 10–12 / sida",
  "Bird Dog":"3 × 8–10 / sida",
  "Hanging Knee Raise":"3 × 8–12",
  "Reverse Crunch":"3 × 10–15",
  "Side Plank":"3 × 20–40 sek / sida",
  "Ab Wheel Rollout":"3 × 6–12",
  "Hanging Leg Raise":"3 × 6–12",

  "Marklyft":"3 × 5",
  "Latsdrag":"3 × 8–10",
  "Sittande kabelrodd":"3 × 8–10",
  "t-bar rodd":"2 × 6–8",
  "Face Pulls":"3 × 12–15",
  "Hammercurl":"3 × 10–12",
  "EZ-bar curl":"2 × 12–15",
  "Maskinpress":"4 × 6–8",
  "Lutande hantelpress":"3 × 8–10",
  "Sittande axelpress":"3 × 8–10",
  "Sidolyft":"3 × 6–10",
  "Pec Deck":"3 × 12–15",
  "Triceps Pushdown":"3 × 10–12",
  "Overhead Triceps Extension":"2 × 12–15",
  "Knäböj":"4 × 6–8",
  "Rumänska marklyft (RDL)":"3 × 8–10",
  "Bulgarian Split Squat":"3 × 8–10",
  "Hip Thrust":"3 × 10–12",
  "Lårcurl":"3 × 10–12",
  "Benspark":"3 × 6–8",
  "Vadpress (sittande)":"4 × 12–15"
};

const EXERCISES = ["Övrigt",
  "Bänkpress","Lutande bänkpress","Lutande hantelpress","Hantelpress","Maskinpress",
  "Sittande axelpress","Militärpress","Arnoldpress","Sidolyft","Omvända flyes","Pec Deck",
  "Cable fly","Dips","Push-ups","Triceps Pushdown","Overhead Triceps Extension","Fransk press",
  "Marklyft","Rumänska marklyft (RDL)","Sumomarklyft","Rack Pull","Good Morning",
  "Knäböj","Frontböj","Hack Squat","Leg press","Bulgarian Split Squat","Utfall","Gående utfall",
  "Hip Thrust","Glute Bridge","Lårcurl","Benspark","Vadpress (stående)","Vadpress (sittande)",
  "Latsdrag","Pull-ups","Chins","Assisted Pull-ups","Sittande kabelrodd","T-bar rodd",
  "Chest-supported row","Enarms hantelrodd","Face Pulls","Straight-arm Pulldown",
  "Hammercurl","EZ-bar curl","Bicepscurl","Preacher Curl","Cable Curl","Concentration Curl",
  "Dead Bug","Cable Crunch","RKC Plank","Pallof Press","Bird Dog","Hanging Knee Raise",
  "Reverse Crunch","Side Plank","Ab Wheel Rollout","Hanging Leg Raise","Leg Raise",
  "Russian Twist","Back Extension","Farmer's Walk","Shrugs","Wrist Curl"
];
const defaultData = {
  programs:[
{id:"core",name:"CORE",days:[
    {id:"core-a",name:"CORE A",exercises:["Dead Bug","Cable Crunch","RKC Plank","Pallof Press","Bird Dog","Hanging Knee Raise"]},
    {id:"core-b",name:"CORE B",exercises:["Cable Crunch","Reverse Crunch","Side Plank","Pallof Press","Ab Wheel Rollout","Hanging Leg Raise"]}
  ]},
{id:"ppl",name:"PPL",days:[
    {id:"pull",name:"PULL",exercises:["Marklyft","Latsdrag","Sittande kabelrodd","t-bar rodd","Face Pulls","Hammercurl","EZ-bar curl"]},
    {id:"push",name:"PUSH",exercises:["Maskinpress","Lutande hantelpress","Sittande axelpress","Sidolyft","Pec Deck","Triceps Pushdown","Overhead Triceps Extension"]},
    {id:"legs",name:"LEGS",exercises:["Knäböj","Rumänska marklyft (RDL)","Bulgarian Split Squat","Hip Thrust","Lårcurl","Benspark","Vadpress (sittande)"]}
  ]}],
  logs:[]
};
let data = JSON.parse(localStorage.getItem("traningslogg") || "null") || defaultData;const BUILTIN_EXERCISE_BANK = EXERCISES.filter(e=>e!=="Övrigt");
if(!data.exerciseBank || !Array.isArray(data.exerciseBank)) data.exerciseBank=[];
data.exerciseBank=[...new Set([...BUILTIN_EXERCISE_BANK,...data.exerciseBank].map(x=>String(x).trim()).filter(Boolean))];
function getExerciseBank(){ return [...new Set(data.exerciseBank||[])].sort((a,b)=>a.localeCompare(b,"sv")); }
function saveExerciseToBank(name){

function isoDateOnly(value){
  return new Date(value).toISOString().slice(0,10);

function localLogSignature(log,profileName){
  return [
    profileName,
    isoDateOnly(log.date),
    log.exercise,
    log.isExtra?"1":"0",
    JSON.stringify(log.sets||[])
  ].join("|");

async function syncToCloud(){
  if(!navigator.onLine)return;

  // Map local profiles to cloud profiles by name.
  const {data:remoteProfiles,error:profileError}=await cloudClient.from("profiles").select("*");
  if(profileError) throw profileError;
  const remoteByName={};
  (remoteProfiles||[]).forEach(p=>remoteByName[p.name]=p);

  for(const lp of data.profiles){
    if(!remoteByName[lp.name]){
      const {data:created,error}=await cloudClient.from("profiles").insert({name:lp.name}).select().single();
      if(error) throw error;
      remoteByName[lp.name]=created;
    }
  }

  const {data:remoteWorkouts,error:workoutError}=await cloudClient.from("workouts").select("*");
  if(workoutError) throw workoutError;
  const workoutIds=(remoteWorkouts||[]).map(w=>w.id);
  let remoteSets=[];
  if(workoutIds.length){
    const {data:rs,error:setError}=await cloudClient.from("workout_sets").select("*").in("workout_id",workoutIds);
    if(setError) throw setError;
    remoteSets=rs||[];
  }

  const remoteBySignature=new Set();
  (remoteWorkouts||[]).forEach(w=>{
    const person=(remoteProfiles||[]).find(p=>p.id===w.profile_id);
    const sets=remoteSets.filter(s=>s.workout_id===w.id).map(s=>({
      kg:s.weight==null?0:Number(s.weight),
      reps:s.reps==null?0:Number(s.reps),
      ...(s.duration?{duration:s.duration}:{}),
      ...(s.exercise_name==="Övrigt"&&s.duration?{name:"Övrigt"}:{})
    }));
    // For cloud entries, include exercise name and set values in the signature.
    const exerciseGroups={};
    remoteSets.filter(s=>s.workout_id===w.id).forEach(s=>{
      if(!exerciseGroups[s.exercise_name])exerciseGroups[s.exercise_name]=[];
      exerciseGroups[s.exercise_name].push({
        kg:s.weight==null?0:Number(s.weight),
        reps:s.reps==null?0:Number(s.reps),
        ...(s.duration?{duration:s.duration}:{}),
        
      });
    });
    Object.entries(exerciseGroups).forEach(([ex,arr])=>{
      const isOther=ex.startsWith("Övrigt:");
      const cleanEx=isOther?"Övrigt":ex;
      if(isOther)arr.forEach(s=>s.name=ex.slice(7).trim());
      const sig=[person?.name||"",w.workout_date,cleanEx,isOther?"1":"0",JSON.stringify(arr)].join("|");
      remoteBySignature.add(sig);
    });
  });

  // Upload local logs that are not already present.
  for(const log of data.logs){
    const lp=data.profiles.find(p=>p.id===log.profileId);
    if(!lp || !remoteByName[lp.name])continue;
    const remoteProfile=remoteByName[lp.name];
    const date=isoDateOnly(log.date);
    const signature=localLogSignature(log,lp.name);
    if(remoteBySignature.has(signature))continue;

    const {data:rw,error:rwError}=await cloudClient.from("workouts").insert({
      profile_id:remoteProfile.id,
      workout_date:date,
      program_name:"",
      workout_name:""
    }).select().single();
    if(rwError) throw rwError;

    const rows=(log.sets||[]).map((s,i)=>({
      workout_id:rw.id,
      exercise_name:(log.exercise==="Övrigt" && log.sets?.[0]?.name) ? ("Övrigt: "+log.sets[0].name) : log.exercise,
      set_number:i+1,
      weight:(s.kg!==undefined && s.kg!==0)?s.kg:null,
      reps:(s.reps!==undefined && s.reps!==0)?s.reps:null,
      duration:s.time||s.duration||null,
      is_extra:!!log.isExtra
    }));
    if(rows.length){
      const {error:rsError}=await cloudClient.from("workout_sets").insert(rows);
      if(rsError) throw rsError;
    }
    remoteBySignature.add(signature);
  }
}
async function syncFromCloud(){
  if(!navigator.onLine)return;
  try{
    const {data:remoteProfiles,error:profileError}=await cloudClient.from("profiles").select("*").order("created_at");
    if(profileError)throw profileError;

    // Add remote profiles locally by name.
    (remoteProfiles||[]).forEach(rp=>{
      if(!data.profiles.some(lp=>lp.name===rp.name)){
        data.profiles.push({id:"cloud_"+rp.id,name:rp.name});
      }
    });

    const {data:remoteWorkouts,error:workoutError}=await cloudClient.from("workouts").select("*");
    if(workoutError)throw workoutError;
    const ids=(remoteWorkouts||[]).map(w=>w.id);
    let remoteSets=[];
    if(ids.length){
      const {data:rs,error:setError}=await cloudClient.from("workout_sets").select("*").in("workout_id",ids);
      if(setError)throw setError;
      remoteSets=rs||[];
    }

    const remoteProfilesById={};
    (remoteProfiles||[]).forEach(p=>remoteProfilesById[p.id]=p);

    for(const w of remoteWorkouts||[]){
      const rp=remoteProfilesById[w.profile_id];
      if(!rp)continue;
      const lp=data.profiles.find(p=>p.name===rp.name);
      if(!lp)continue;

      const groups={};
      remoteSets.filter(s=>s.workout_id===w.id).forEach(s=>{
        if(!groups[s.exercise_name])groups[s.exercise_name]=[];
        groups[s.exercise_name].push({
          kg:s.weight==null?0:Number(s.weight),
          reps:s.reps==null?0:Number(s.reps),
          ...(s.duration?{time:s.duration}:{}),
          
        });
      });

      for(const [exercise,sets] of Object.entries(groups)){
        const isOther=exercise.startsWith("Övrigt:");
        if(isOther){
          const customName=exercise.slice(7).trim();
          sets.forEach(s=>s.name=customName);
        }
        const cleanExercise=isOther?"Övrigt":exercise;
        const candidate={date:new Date(w.workout_date+"T12:00:00").toISOString(),profileId:lp.id,exercise:cleanExercise,sets,isExtra:isOther||sets.some(s=>s.time)};
        const sig=localLogSignature(candidate,lp.name);
        const exists=data.logs.some(l=>{
          const p=data.profiles.find(x=>x.id===l.profileId);
          return p && localLogSignature(l,p.name)===sig;
        });
        if(!exists)data.logs.push(candidate);
      }
    }

    localStorage.setItem("traningslogg",JSON.stringify(data));
    render();
    // Push any newly discovered local profiles/logs back so both devices converge.
    await syncToCloud();
  }catch(err){
    console.warn("Workouts cloud sync:",err);
  }
}

function qualityForDay(key){
  const logs=logsForDay(key);
  if(!logs.length)return "";
  const totalSets=logs.reduce((n,l)=>n+l.sets.length,0);
  const totalReps=logs.reduce((n,l)=>n+l.sets.reduce((a,s)=>a+s.reps,0),0);
  let improved=false;
  logs.forEach(l=>{
    const previous=data.logs.filter(x=>x.exercise===l.exercise && dateKey(x.date)<key);
    const oldMax=previous.length ? Math.max(...previous.flatMap(x=>x.sets.map(s=>s.kg||0))) : 0;
    const newMax=Math.max(...l.sets.map(s=>s.kg||0));
    if(oldMax>0 && newMax>oldMax) improved=true;
  });
  const hasExtra=logs.some(l=>l.isExtra);
  if(improved || hasExtra || totalReps>=40 || totalSets>=15)return "🔥";
  if(totalReps>=25 || totalSets>=9)return "💪";
  return "🙂";
}

function qualityForPersonDay(key,profileId){
  const logs=data.logs.filter(l=>dateKey(l.date)===key && l.profileId===profileId);

  logs.forEach(l=>{
    (l.sets||[]).forEach(s=>{
      const reps=Number(s.reps)||0;
      const kg=Number(s.kg)||0;
      if(reps>=12)score+=3;
      else if(reps>=8)score+=2;
      else if(reps>=5)score+=1;
      if(kg>0)score+=1;
      if(l.isExtra)score+=2;
    });
  });

  if(score>=12)return "💪";
  if(score>=6)return "🙂";
  return "😐";
}

function personExerciseMax(profileId, exercise){
  const logs=data.logs.filter(l=>l.profileId===profileId && l.exercise===exercise);
  let max=0;
  logs.forEach(l=>(l.sets||[]).forEach(s=>{max=Math.max(max,Number(s.kg)||0)}));
  return max;
}

function smartWeightSuggestion(profileId, exercise, percent){
  const ownMax=personExerciseMax(profileId,exercise);
  if(ownMax>0){
    return {
      weight: roundTrainingWeight(ownMax*(Number(percent)||0)/100),
      source:"eget PB",
      basedOn:exercise
    };
  }

  const related=RELATED_EXERCISES[exercise]||[];
  for(const candidate of related){
    const max=personExerciseMax(profileId,candidate);
    if(max>0){
      // Conservative default relationship: use 70% of the related exercise's
      // recorded max as a starting point, then apply the requested percentage.
      const estimatedOneRM=max*0.70;
      return {
        weight:roundTrainingWeight(estimatedOneRM*(Number(percent)||0)/100),
        source:"liknande övning",
        basedOn:candidate
      };
    }
  }
  return null;
}

function roundTrainingWeight(value){
  if(!value || value<=0)return 0;
  // Round to practical gym increments.
  const step=value<30?1:2.5;
  return Math.round(value/step)*step;
}

function smartSuggestionHtml(profileId,exercise,percent){
  const s=smartWeightSuggestion(profileId,exercise,percent);
  if(!s)return "";
  const pct=Number(percent)||0;
  if(s.source==="eget PB"){
    return `<div class="smart-weight">💡 <b>Rekommenderad vikt: ${s.weight} kg</b> · ${pct}% av ditt PB</div>`;
  }
  return `<div class="smart-weight">💡 <b>Rekommenderad startvikt: ca ${s.weight} kg</b><br><span class="sub">Baserat på ${esc(s.basedOn)} och dina registrerade resultat.</span></div>`;
}

function getPreviousExerciseLog(profileId,exercise,beforeDate){
  const cutoff=beforeDate || dateKey(new Date());
  const logs=data.logs.filter(l=>{
    if(l.profileId!==profileId || l.exercise!==exercise)return false;
    const d=dateKey(l.date);
    return d<cutoff;
  });
  logs.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return logs.length?logs[0]:null;
}
function formatPreviousSets(log){
  if(!log || !log.sets || !log.sets.length)return "Inget tidigare resultat";
  return log.sets.map(s=>{
    if(s.time || s.duration)return `${s.name||"Övrigt"} · ${s.time||s.duration}`;
    return `${s.kg||0} kg × ${s.reps||0}`;
  }).join(", ");
}
function parseRepTarget(exercise){
  const text=String(EXERCISE_TARGETS[exercise]||"");
  const m=text.match(/(\d+)\s*[–-]\s*(\d+)/);
  return m?{min:Number(m[1]),max:Number(m[2]),stretch:Number(m[2])+2}:null;
}
function manualGoalKey(profileId,exercise){return `manualGoal:${profileId}:${exercise}`;}
function getManualGoal(profileId,exercise){try{return JSON.parse(localStorage.getItem(manualGoalKey(profileId,exercise))||"null")}catch(e){return null}}
function setManualGoal(profileId,exercise,goal){localStorage.setItem(manualGoalKey(profileId,exercise),JSON.stringify(goal));}
function nextGoal(profileId,exercise,beforeDate){
  const manual=getManualGoal(profileId,exercise); if(manual)return manual.text;
  const target=parseRepTarget(exercise);
  const cutoff=beforeDate||dateKey(new Date());
  const history=data.logs.filter(l=>l.profileId===profileId&&l.exercise===exercise&&dateKey(l.date)<cutoff).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const prev=history[0];
  if(!prev)return target?`🎯 Nästa mål: nå ${target.min} reps.`:"🎯 Nästa mål: registrera ditt första resultat.";
  const sets=(prev.sets||[]).map(x=>({kg:Number(x.kg)||0,reps:Number(x.reps)||0})).filter(x=>x.kg||x.reps);
  if(!sets.length)return "🎯 Nästa mål: bygg vidare på föregående resultat.";
  // Use one actual set as the reference so weight and reps can never be mixed from different sets.
  const reference=sets.slice().sort((a,b)=>b.reps-a.reps || b.kg-a.kg)[0];
  const kg=reference.kg, reps=reference.reps;
  if(!target)return `🎯 Nästa mål: ${reps+1} reps på ${kg} kg.`;
  // Never suggest a weight increase before the top of the programmed rep range has been reached.
  if(reps<target.max)return `🎯 Nästa mål: ${Math.min(target.max,reps+1)} reps på ${kg} kg.`;
  // After the top of the range, build one rep at a time up to max + 2.
  if(reps<target.stretch)return `🎯 Nästa mål: ${reps+1} reps på ${kg} kg.`;
  // Weight increase is unlocked only after max + 2 reps has been achieved on the SAME weight in two separate workouts.
  const qualifying=history.filter(l=>{
    const ss=(l.sets||[]).map(x=>({kg:Number(x.kg)||0,reps:Number(x.reps)||0}));
    return ss.some(x=>x.kg===kg && x.reps>=target.stretch);
  });
  const distinctDates=[...new Set(qualifying.map(l=>dateKey(l.date)))];
  if(distinctDates.length>=2)return `🎯 Nästa mål: öka vikten från ${kg} kg.`;
  return `🎯 Nästa mål: gör ${target.stretch} reps på ${kg} kg i ett pass till.`;
}

function buildWorkoutSummary(logs,profileId){
  const person=data.profiles.find(p=>p.id===profileId);
  const mine=logs.filter(l=>l.profileId===profileId);
  let increased=0, improvedReps=0, unchanged=0;
  const details=[];

  mine.forEach(l=>{
    const prev=getPreviousExerciseLog(profileId,l.exercise,dateKey(l.date));
    if(!prev){
      details.push({exercise:l.exercise,text:"🆕 Första registreringen"});
      return;
    }
    const curMax=Math.max(...(l.sets||[]).map(s=>Number(s.kg)||0));
    const prevMax=Math.max(...(prev.sets||[]).map(s=>Number(s.kg)||0));
    const curReps=Math.max(...(l.sets||[]).map(s=>Number(s.reps)||0));
    const prevReps=Math.max(...(prev.sets||[]).map(s=>Number(s.reps)||0));

    if(curMax>prevMax){increased++;details.push({exercise:l.exercise,text:`📈 +${curMax-prevMax} kg`});}
    else if(curReps>prevReps){improvedReps++;details.push({exercise:l.exercise,text:`🔢 +${curReps-prevReps} reps`});}
    else {unchanged++;details.push({exercise:l.exercise,text:"➡️ Stabilt"});}
  });

  const score=increased*3+improvedReps*2+(mine.length?1:0);
  const quality=score>=9?"🔥":score>=5?"💪":score>=2?"🙂":"😐";

  const next=mine.map(l=>{
    const prev=getPreviousExerciseLog(profileId,l.exercise,dateKey(l.date));
    if(!prev)return null;
    const sets=(prev.sets||[]).map(s=>({kg:Number(s.kg)||0,reps:Number(s.reps)||0})).filter(s=>s.kg||s.reps);
    if(!sets.length)return null;
    const maxKg=Math.max(...sets.map(s=>s.kg));
    const maxReps=Math.max(...sets.map(s=>s.reps));
    const allTop=sets.every(s=>s.kg===maxKg && s.reps>=maxReps);
    const target=allTop
      ? `${maxKg} kg × ${maxReps} → testa lite högre vikt`
      : sets.map(s=>`${maxKg} kg × ${Math.max(s.reps,Math.min(maxReps,s.reps+1))}`).join(", ");
    return {exercise:l.exercise,target};
  }).filter(Boolean);

  return {person,quality,mine,increased,improvedReps,unchanged,details,next};
}

        })).filter(s=>s.kg>0 || s.reps>0);

        if(sets.length){
          data.logs.push({date,profileId,exercise:ex,sets});
        }
      }
    });

    // Extra övningar som lades till efter att passet startade.
    document.querySelectorAll(".extra-workout-exercise").forEach(card=>{
      const ex=card.dataset.extraExercise;
      const extraId=card.dataset.extraId;
      const rows=[...document.querySelectorAll(`#sets-${extraId}-${pi} > .sets`)];
      const sets=rows.map(row=>({
        kg:parseFloat(row.querySelector(".weight-input")?.value)||0,
        reps:parseInt(row.querySelector(".reps-input")?.value)||0
      })).filter(s=>s.kg>0 || s.reps>0);
      if(sets.length)data.logs.push({date,profileId,exercise:ex,sets,isExtra:true});
    });
  });

  localStorage.removeItem(draftKey());
  save();
  const finishedDate=dateKey(date);
  const finishedLogs=data.logs.filter(l=>dateKey(l.date)===finishedDate && workoutProfiles.includes(l.profileId));
  showWorkoutSummary(finishedLogs,workoutProfiles);
  activeDay=null;
  activeWorkoutDate=null;
  workoutProfiles=[data.activeProfile];
  showTab("calendar");
}

function getPreviousForProfile(ex,profileId){
  if(ex==="Övrigt")return "";
  const logs=data.logs.filter(l=>l.exercise===ex && l.profileId===profileId);
  if(!logs.length)return "";
  const last=logs[logs.length-1];
  return last.sets.map(s=>`${s.kg}×${s.reps}`).join(" · ");
}

function addFreeExercise(){
  const options=getExerciseBank().map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("");

        <option value="">Välj övning</option>${options}

    </div>

function addFreeExerciseToPage(){
  const sel=document.getElementById("freeExerciseSelect");
  let ex=sel?.value||"";
  if(ex==="__custom")ex=document.getElementById("freeCustomName")?.value.trim()||"";
  if(!ex){alert("Välj eller skriv en övning.");return;}

  const id="free_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  const box=document.getElementById("freeWorkoutExercises");
  const people=workoutProfiles.map(id=>data.profiles.find(x=>x.id===id)).filter(Boolean);

  box.insertAdjacentHTML("beforeend",`
    <div class="card free-exercise" data-free-exercise="${esc(ex)}" data-free-id="${id}">
      <div class="row">
        <div><b>${ex==="Övrigt"?"⏱️":"🏋️"} ${esc(ex)}</b><div class="sub">Fritt pass</div></div>
        <button class="delete-set" title="Ta bort övning" onclick="this.closest('.free-exercise').remove()">✕</button>
      </div>
      ${people.map((p,pi)=>`
        <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px">
          <div class="row">
            <b>👤 ${esc(p.name)}</b>
            <button class="secondary" onclick="addFreeSet('${id}',${pi},'${ex==="Övrigt"?"other":"normal"}')">＋ Set</button>

          <div id="free-sets-${id}-${pi}"></div>
        </div>`).join("")}
    </div>`);
  people.forEach((_,pi)=>addFreeSet(id,pi,ex==="Övrigt"?"other":"normal"));
  closeModal();
}

function addFreeSet(id,pi,type){
  const box=document.getElementById(`free-sets-${id}-${pi}`);
  if(!box)return;
  const n=box.children.length+1;
  if(type==="other"){
    box.insertAdjacentHTML("beforeend",`
      <div class="sets" data-set="${n}" style="margin-top:7px">
        <div>${n}</div>
        <input class="other-name" placeholder="Övning">
        <input class="other-time" placeholder="Tid">
        <button class="delete-set" title="Ta bort set" onclick="this.parentElement.remove();saveWorkoutDraft()">✕</button>
      </div>`);
  }else{
    box.insertAdjacentHTML("beforeend",`
      <div class="sets" data-set="${n}" style="margin-top:7px">
        <div>${n}</div>
        <input class="weight-input" inputmode="decimal" placeholder="kg">
        <input class="reps-input" inputmode="numeric" placeholder="reps">
        <button class="delete-set" title="Ta bort set" onclick="this.parentElement.remove();saveWorkoutDraft()">✕</button>
      </div>`);
  }
}

function finishFreeWorkout(){
  const dateValue=document.getElementById("freeWorkoutDate")?.value||dateKey(new Date());
  const date=new Date(dateValue+"T12:00:00").toISOString();

  document.querySelectorAll(".free-exercise").forEach(card=>{
    const ex=card.dataset.freeExercise;
    const id=card.dataset.freeId;
    workoutProfiles.forEach((profileId,pi)=>{
      const rows=[...document.querySelectorAll(`#free-sets-${id}-${pi} > .sets`)];
      if(ex==="Övrigt"){
        rows.forEach(row=>{
          const name=row.querySelector(".other-name")?.value.trim();
          const time=row.querySelector(".other-time")?.value.trim();
          if(name||time)data.logs.push({date,profileId,exercise:"Övrigt",sets:[{name:name||"Övrigt",time:time||""}],isExtra:true});
        });
      }else{
        const sets=rows.map(row=>({
          kg:parseFloat(row.querySelector(".weight-input")?.value)||0,
          reps:parseInt(row.querySelector(".reps-input")?.value)||0
        })).filter(s=>s.kg>0||s.reps>0);
        if(sets.length)data.logs.push({date,profileId,exercise:ex,sets,isExtra:true});
      }
    });
  });

  save();
  activeDay=null;
  activeWorkoutDate=null;
  workoutProfiles=[data.activeProfile];
  showTab("calendar");
}
function showProfiles(){
  openModal(`<h2>👤 Profiler</h2>
  <div class="sub" style="margin-bottom:10px">Välj en profil eller lägg till fler personer.</div>
  ${data.profiles.map(p=>`<div class="exercisePick">
    <span>👤 ${esc(p.name)}</span>
    <div class="actions" style="margin:0">
      <button class="secondary" onclick="selectProfile('${p.id}')">${p.id===data.activeProfile?"Vald":"Välj"}</button>
      <button class="secondary" onclick="renameProfile('${p.id}')">✏️ Byt namn</button>

  save();
  closeModal();
  render();
}
function addProfile(){
  openModal(`<h2>👤 Lägg till person</h2>
  <div class="sub">Skriv namnet på personen.</div>
  <input id="profileName" placeholder="Namn">
  <div class="actions">
    <button onclick="createProfile()">Lägg till</button>
    <button class="secondary" onclick="showProfiles()">Avbryt</button>
  </div>`);
}
function createProfile(){
  const name=document.getElementById("profileName").value.trim();
  if(!name)return;
  const id="p"+Date.now();
  data.profiles.push({id,name});
  save();
  showProfiles();
}
function renameProfile(id){
  const p=data.profiles.find(x=>x.id===id);
  if(!p)return;
  openModal(`<h2>✏️ Byt namn</h2>
  <input id="profileName" value="${esc(p.name)}">
  <div class="actions">
    <button onclick="saveProfileName('${id}')">Spara</button>
    <button class="secondary" onclick="showProfiles()">Avbryt</button>
  </div>`);
}
function saveProfileName(id){
  const name=document.getElementById("profileName").value.trim();
  if(!name)return;
  const p=data.profiles.find(x=>x.id===id);
  if(p)p.name=name;
  save();
  showProfiles();
}
function deleteProfile(id){
  if(data.profiles.length<=1)return;
  const p=data.profiles.find(x=>x.id===id);
  if(!p)return;
  if(!confirm(`Ta bort profilen ${p.name}? Träningshistoriken för profilen tas också bort.`))return;
  data.profiles=data.profiles.filter(x=>x.id!==id);
  data.logs=data.logs.filter(x=>x.profileId!==id);
  if(data.activeProfile===id)data.activeProfile=data.profiles[0].id;
  save();
  showProfiles();
}
function showTrainingMode(){
  const selected = new Set(workoutProfiles && workoutProfiles.length ? workoutProfiles : data.profiles.map(p=>p.id));
  openModal(`<h2>🏋️ Träna</h2>
  <div class="sub" style="margin-bottom:8px">Välj vilka personer som tränar idag.</div>
  ${data.profiles.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
    <input type="checkbox" style="width:auto" value="${p.id}" ${selected.has(p.id)?"checked":""}>
    <span>👤 ${esc(p.name)}</span>

  <div class="actions">
    <button onclick="saveTrainingMode()">Fortsätt →</button>
    <button class="secondary" onclick="closeModal()">Avbryt</button>
  </div>`);
}
function saveTrainingMode(){
  const ids=[...document.querySelectorAll('#sheet input[type="checkbox"]:checked')].map(x=>x.value);
  if(!ids.length){
    alert("Välj minst en person.");
    return;

function openTogetherWorkoutChooser(){
  const names=workoutProfiles.map(id=>((data.profiles.find(p=>p.id===id)||{}).name||id));
  const programButtons=data.programs.map(p=>`

      <div class="row"><b>📋 ${esc(p.name)}</b><span class="pill">${p.days.length} pass</span></div>
      <div class="actions program-days" style="margin-top:8px">

  openModal(`<h2>🏋️ Välj träning</h2>
    <div class="sub" style="margin-bottom:8px">👥 ${names.length} personer: ${names.map(esc).join(", ")}</div>
    ${programButtons}
    <div class="card" style="margin:8px 0">
      <div class="row"><b>🏋️ Freestyle</b><span class="pill">Fritt pass</span></div>
      <div class="sub" style="margin-top:4px">Alla valda personer tränar tillsammans, men ni väljer övningar fritt.</div>
      <button class="secondary" style="margin-top:8px" onclick="closeModal();startTogetherFreestyle()">🏋️ Freestyle</button>

    <button class="secondary" onclick="closeModal()">Avbryt</button>`);

function startTogetherFreestyle(){
  activeDay={free:true};
  activeWorkoutDate=dateKey(new Date());

}
function showCreateProgram(){
 openModal(`<h2>Skapa träningsprogram</h2><input id="programName" placeholder="T.ex. PPL eller Upper/Lower"><div class="actions"><button onclick="createProgram()">Skapa</button><button class="secondary" onclick="closeModal()">Avbryt</button></div>`);
}
function createProgram(){const n=document.getElementById("programName").value.trim();if(!n)return;data.programs.push({id:Date.now().toString(),name:n,days:[]});save();closeModal();showTab("programs")}
function addDay(pid){openModal(`<h2>Nytt träningspass</h2><input id="dayName" placeholder="T.ex. PUSH"><div class="actions"><button onclick="createDay('${pid}')">Lägg till</button><button class="secondary" onclick="closeModal()">Avbryt</button></div>`)}
function createDay(pid){const n=document.getElementById("dayName").value.trim();if(!n)return;data.programs.find(p=>p.id===pid).days.push({id:Date.now().toString(),name:n,exercises:[]});save();closeModal();render()}

function editExercises(pid,did){
  const d=data.programs.find(p=>p.id===pid).days.find(x=>x.id===did);
  openModal(`<h2>✏️ Redigera ${esc(d.name)}</h2>
    <div class="sub" style="margin-bottom:10px">Dra övningarna för att ändra ordning, eller använd ↑ ↓.</div>
    <div id="editList">
      ${d.exercises.map((e,i)=>`<div class="exercisePick" draggable="true" data-i="${i}"
        ondragstart="dragStart(event)" ondragover="event.preventDefault()" ondrop="dropExercise(event,'${pid}','${did}')">
        <span>☷ &nbsp;🏋️ ${esc(e)}</span>
        <div class="actions" style="margin:0">
          <button class="secondary" onclick="moveExercise('${pid}','${did}',${i},-1)">↑</button>
          <button class="secondary" onclick="moveExercise('${pid}','${did}',${i},1)">↓</button>
          <button class="danger" onclick="removeExercise('${pid}','${did}',${i})">Ta bort</button>
        </div>
      </div>`).join("")}
    </div>
    <div class="actions">
      <button onclick="addExercise('${pid}','${did}')">＋ Lägg till övning</button>
      <button class="secondary" onclick="closeModal();render()">Klar</button>
    </div>`);
}
let draggedIndex=null;
function dragStart(ev){draggedIndex=Number(ev.currentTarget.dataset.i);ev.dataTransfer.effectAllowed="move"}
function dropExercise(ev,pid,did){
  const target=Number(ev.currentTarget.dataset.i);
  if(draggedIndex===null || draggedIndex===target)return;
  const d=data.programs.find(p=>p.id===pid).days.find(x=>x.id===did);
  const [item]=d.exercises.splice(draggedIndex,1);
  d.exercises.splice(target,0,item);
  save(); editExercises(pid,did); draggedIndex=null;
}
function moveExercise(pid,did,index,delta){
  const d=data.programs.find(p=>p.id===pid).days.find(x=>x.id===did);
  const target=index+delta;
  if(target<0 || target>=d.exercises.length)return;
  [d.exercises[index],d.exercises[target]]=[d.exercises[target],d.exercises[index]];
  save(); editExercises(pid,did);
}
function exercisePickerList(items,pid,did){
  if(!items.length)return `<div class="sub" style="padding:12px">Inga övningar matchar.</div>`;
  return items.map(e=>`<div class="exercisePick" onclick="pickExercise('${esc(e)}','${pid}','${did}')"><span>🏋️ ${esc(e)}</span><b>＋</b></div>`).join("");
}
function addExercise(pid,did){
  openModal(`<h2>＋ Lägg till övning</h2>
    <div class="sub">Sök i övningsbanken. Listan filtreras direkt medan du skriver.</div>
    <input id="exerciseSearch" autocomplete="off" placeholder="🔎 Sök övning..." style="width:100%;padding:12px;margin-top:10px;border:1px solid var(--border);border-radius:10px">
    <div id="exerciseResults" style="margin-top:10px;max-height:48vh;overflow:auto">${exercisePickerList(getExerciseBank(),pid,did)}</div>
    <div class="actions" style="margin-top:10px">
      <button class="secondary" onclick="showCustomExercise('${pid}','${did}')">➕ Ny övning</button>
      <button class="secondary" onclick="closeModal()">Stäng</button>
    </div>`);
  const input=document.getElementById("exerciseSearch");
  if(input){
    input.oninput=()=>filterExercisePicker(pid,did);
    input.focus();
  }
}
function filterExercisePicker(pid,did){
  const q=(document.getElementById("exerciseSearch")?.value||"").trim().toLocaleLowerCase("sv");
  const items=getExerciseBank().filter(e=>e.toLocaleLowerCase("sv").startsWith(q));
  const box=document.getElementById("exerciseResults");
  if(box)box.innerHTML=exercisePickerList(items,pid,did);
}
function showCustomExercise(pid,did){
  openModal(`<h2>➕ Lägg till ny övning</h2>
    <div class="sub">Övningen sparas i banken och finns att söka fram nästa gång.</div>
    <input id="customExerciseName" placeholder="T.ex. Zercher Squat" style="width:100%;padding:12px;margin-top:12px;border:1px solid var(--border);border-radius:10px">
    <div class="actions">
      <button onclick="saveCustomExercise('${pid}','${did}')">Spara övning</button>
      <button class="secondary" onclick="addExercise('${pid}','${did}')">Tillbaka</button>
    </div>`);
  document.getElementById("customExerciseName")?.focus();
}
function saveCustomExercise(pid,did){
  const name=(document.getElementById("customExerciseName")?.value||"").trim();
  if(!name){alert("Skriv namnet på övningen.");return;}
  if(name==="Övrigt"){alert("Ange den faktiska övningen.");return;}
  const saved=saveExerciseToBank(name);
  const d=data.programs.find(p=>p.id===pid).days.find(d=>d.id===did);
  if(!d.exercises.some(e=>e.toLowerCase()===saved.toLowerCase()))d.exercises.push(saved);
  save();closeModal();render();
}
function pickExercise(e,pid,did){
  e=String(e||"").trim();
  if(!e || e==="Övrigt")return showCustomExercise(pid,did);
  const saved=saveExerciseToBank(e);
  data.programs.find(p=>p.id===pid).days.find(d=>d.id===did).exercises.push(saved);
  save();closeModal();render();
}
function deleteProgram(pid){if(confirm("Ta bort programmet?")){data.programs=data.programs.filter(p=>p.id!==pid);save();render()}}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
render();
syncFromCloud();
</script>
